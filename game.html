<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跑酷小游戏</title>
  <style>
    /* 全局重置，黑色背景居中显示画布 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(100, 180, 255, 0.3);
    }
    /* 提示文字 */
    #hint {
      margin-top: 12px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hint">空格键 / 点击屏幕 跳跃</div>

  <script>
    // ─────────────────────────────────────────────
    // 画布初始化
    // ─────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');

    // 根据窗口大小自适应画布尺寸
    function resize() {
      const maxW = Math.min(window.innerWidth - 20, 800);
      canvas.width  = maxW;
      canvas.height = Math.round(maxW * 0.4);   // 宽高比 5:2
    }
    resize();
    window.addEventListener('resize', () => { resize(); resetLayout(); });

    // ─────────────────────────────────────────────
    // 全局常量（随画布尺寸动态计算）
    // ─────────────────────────────────────────────
    const W = () => canvas.width;
    const H = () => canvas.height;

    // 地面 Y 坐标（距底部 18%）
    const GROUND_Y = () => Math.round(H() * 0.82);

    // ─────────────────────────────────────────────
    // 游戏状态枚举
    // ─────────────────────────────────────────────
    const STATE = { READY: 0, RUNNING: 1, DEAD: 2 };

    // ─────────────────────────────────────────────
    // 背景层：多层视差滚动
    // ─────────────────────────────────────────────
    const bgLayers = [
      // 远景山丘（速度最慢）
      { speed: 0.3, color: '#2d3561', y: 0.45, amp: 0.12, offset: 0 },
      // 中景山丘
      { speed: 0.7, color: '#3a4a80', y: 0.58, amp: 0.09, offset: 200 },
      // 近景山丘
      { speed: 1.4, color: '#4a5fa0', y: 0.68, amp: 0.06, offset: 500 },
    ];

    // 星星（静止，只是装饰）
    const stars = Array.from({ length: 60 }, () => ({
      x: Math.random(),   // 用比例存储，画时乘以 W()
      y: Math.random() * 0.4,
      r: Math.random() * 1.5 + 0.3,
      alpha: Math.random() * 0.6 + 0.3,
    }));

    // 绘制视差背景
    function drawBackground(dt) {
      // 天空渐变
      const sky = ctx.createLinearGradient(0, 0, 0, H());
      sky.addColorStop(0,   '#0d0d2b');
      sky.addColorStop(0.7, '#1a1a4e');
      sky.addColorStop(1,   '#2a2a6e');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W(), H());

      // 星星
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x * W(), s.y * H(), s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // 月亮
      ctx.fillStyle = '#fffde7';
      ctx.beginPath();
      ctx.arc(W() * 0.88, H() * 0.12, H() * 0.06, 0, Math.PI * 2);
      ctx.fill();
      // 月牙遮罩
      ctx.fillStyle = '#0d0d2b';
      ctx.beginPath();
      ctx.arc(W() * 0.9, H() * 0.1, H() * 0.055, 0, Math.PI * 2);
      ctx.fill();

      // 各视差层山丘
      bgLayers.forEach(layer => {
        if (game.state === STATE.RUNNING) {
          layer.offset += layer.speed * game.speed * dt;
        }
        drawHill(layer);
      });
    }

    // 绘制单个山丘层（用正弦波模拟山形）
    function drawHill(layer) {
      const groundY = GROUND_Y();
      ctx.fillStyle = layer.color;
      ctx.beginPath();
      ctx.moveTo(0, H());
      for (let x = 0; x <= W(); x += 4) {
        const y = groundY * layer.y
                  + Math.sin((x + layer.offset) * 0.008) * H() * layer.amp
                  + Math.cos((x + layer.offset) * 0.005) * H() * layer.amp * 0.5;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W(), H());
      ctx.closePath();
      ctx.fill();
    }

    // ─────────────────────────────────────────────
    // 地面绘制
    // ─────────────────────────────────────────────
    let groundOffset = 0;   // 地面纹理滚动偏移

    function drawGround() {
      const gy = GROUND_Y();

      // 地面主体
      const grad = ctx.createLinearGradient(0, gy, 0, H());
      grad.addColorStop(0, '#3d7a3d');
      grad.addColorStop(0.1, '#2d5a2d');
      grad.addColorStop(1, '#1a3a1a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, gy, W(), H() - gy);

      // 地面顶部高光线
      ctx.strokeStyle = '#5aaa5a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W(), gy);
      ctx.stroke();

      // 滚动的地面虚线纹理（营造速度感）
      if (game.state === STATE.RUNNING) {
        groundOffset = (groundOffset + game.speed * 3) % 60;
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      ctx.setLineDash([20, 40]);
      ctx.lineDashOffset = -groundOffset;
      ctx.beginPath();
      ctx.moveTo(0, gy + 8);
      ctx.lineTo(W(), gy + 8);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // ─────────────────────────────────────────────
    // 玩家角色
    // ─────────────────────────────────────────────
    const player = {
      x: 0, y: 0,           // 实际坐标（每帧计算）
      w: 0, h: 0,           // 宽高
      vy: 0,                // 竖直速度
      onGround: false,
      jumpCount: 0,         // 已跳次数（支持二段跳）
      maxJumps: 2,

      // 动画帧
      frame: 0,
      frameTimer: 0,
      frameDuration: 0.1,   // 每帧持续秒数

      // 根据画布大小重置位置和尺寸
      reset() {
        this.w = H() * 0.13;
        this.h = H() * 0.18;
        this.x = W() * 0.15;
        this.y = GROUND_Y() - this.h;
        this.vy = 0;
        this.onGround = true;
        this.jumpCount = 0;
        this.frame = 0;
        this.frameTimer = 0;
      },

      jump() {
        if (this.jumpCount < this.maxJumps) {
          // 跳跃力度（负值向上）
          this.vy = -H() * 0.022;
          this.jumpCount++;
          this.onGround = false;
          spawnJumpParticles(this.x + this.w / 2, this.y + this.h);
        }
      },

      update(dt) {
        // 重力
        this.vy += H() * 0.045 * dt;
        this.y  += this.vy * 60 * dt;

        const groundY = GROUND_Y() - this.h;
        if (this.y >= groundY) {
          this.y = groundY;
          this.vy = 0;
          this.onGround = true;
          this.jumpCount = 0;
        }

        // 跑步帧动画计时
        if (this.onGround) {
          this.frameTimer += dt;
          if (this.frameTimer >= this.frameDuration) {
            this.frameTimer = 0;
            this.frame = (this.frame + 1) % 4;
          }
        }
      },

      draw() {
        const x = this.x, y = this.y, w = this.w, h = this.h;

        // 腿部动画（在地面时摆动）
        const legSwing = this.onGround ? Math.sin(this.frame * Math.PI / 2) * w * 0.2 : 0;

        // 后腿
        ctx.fillStyle = '#1565c0';
        ctx.beginPath();
        ctx.roundRect(x + w * 0.3 - legSwing, y + h * 0.6, w * 0.22, h * 0.4, 4);
        ctx.fill();

        // 前腿
        ctx.fillStyle = '#1976d2';
        ctx.beginPath();
        ctx.roundRect(x + w * 0.5 + legSwing, y + h * 0.6, w * 0.22, h * 0.4, 4);
        ctx.fill();

        // 鞋子
        ctx.fillStyle = '#fff176';
        [[x + w * 0.28 - legSwing, y + h * 0.93], [x + w * 0.48 + legSwing, y + h * 0.93]].forEach(([sx, sy]) => {
          ctx.beginPath();
          ctx.roundRect(sx, sy, w * 0.28, h * 0.1, 3);
          ctx.fill();
        });

        // 躯干
        const bodyGrad = ctx.createLinearGradient(x, y + h * 0.2, x + w, y + h * 0.6);
        bodyGrad.addColorStop(0, '#ef5350');
        bodyGrad.addColorStop(1, '#b71c1c');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.roundRect(x + w * 0.1, y + h * 0.25, w * 0.8, h * 0.38, 6);
        ctx.fill();

        // 手臂（摆动方向与腿相反）
        ctx.fillStyle = '#ffcc80';
        ctx.beginPath();
        ctx.roundRect(x - w * 0.05 + legSwing * 0.5, y + h * 0.28, w * 0.18, h * 0.28, 4);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(x + w * 0.87 - legSwing * 0.5, y + h * 0.28, w * 0.18, h * 0.28, 4);
        ctx.fill();

        // 头
        ctx.fillStyle = '#ffcc80';
        ctx.beginPath();
        ctx.arc(x + w * 0.5, y + h * 0.15, w * 0.3, 0, Math.PI * 2);
        ctx.fill();

        // 头盔
        ctx.fillStyle = '#e53935';
        ctx.beginPath();
        ctx.ellipse(x + w * 0.5, y + h * 0.07, w * 0.32, h * 0.1, 0, Math.PI, 0);
        ctx.fill();

        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + w * 0.62, y + h * 0.13, w * 0.09, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(x + w * 0.64, y + h * 0.13, w * 0.045, 0, Math.PI * 2);
        ctx.fill();
      },

      // 碰撞盒（比视觉稍小，更宽松）
      getBox() {
        return {
          x: this.x + this.w * 0.2,
          y: this.y + this.h * 0.1,
          w: this.w * 0.6,
          h: this.h * 0.85,
        };
      },
    };

    // ─────────────────────────────────────────────
    // 障碍物
    // ─────────────────────────────────────────────
    const obstacles = [];

    // 障碍物类型定义
    const OBS_TYPES = [
      // 矮石块
      { wRatio: 0.06, hRatio: 0.12, color: '#78909c', top: '#b0bec5', label: 'rock' },
      // 中石块
      { wRatio: 0.05, hRatio: 0.20, color: '#607d8b', top: '#90a4ae', label: 'rock2' },
      // 仙人掌
      { wRatio: 0.04, hRatio: 0.22, color: '#388e3c', top: '#66bb6a', label: 'cactus' },
      // 宽矮障碍
      { wRatio: 0.09, hRatio: 0.10, color: '#8d6e63', top: '#bcaaa4', label: 'log' },
    ];

    function spawnObstacle() {
      const type = OBS_TYPES[Math.floor(Math.random() * OBS_TYPES.length)];
      const ow = W() * type.wRatio;
      const oh = H() * type.hRatio;
      obstacles.push({
        x: W() + ow,
        y: GROUND_Y() - oh,
        w: ow,
        h: oh,
        color: type.color,
        top:   type.top,
        label: type.label,
      });
    }

    function updateObstacles(dt) {
      // 随机生成间隔（基于分数递减，越跑越密）
      game.obsTimer += dt;
      const interval = Math.max(0.9, 2.2 - game.score * 0.0005);
      if (game.obsTimer >= interval) {
        game.obsTimer = 0;
        spawnObstacle();
        // 分数高时偶尔连续生成
        if (game.score > 500 && Math.random() < 0.3) {
          setTimeout(spawnObstacle, 300);
        }
      }

      // 移动并清理出屏障碍物
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= game.speed * W() * dt;
        if (obstacles[i].x + obstacles[i].w < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    function drawObstacles() {
      obstacles.forEach(o => {
        if (o.label === 'cactus') {
          drawCactus(o);
        } else {
          drawBlock(o);
        }
      });
    }

    function drawBlock(o) {
      // 主体
      ctx.fillStyle = o.color;
      ctx.beginPath();
      ctx.roundRect(o.x, o.y, o.w, o.h, 3);
      ctx.fill();
      // 顶面高光
      ctx.fillStyle = o.top;
      ctx.beginPath();
      ctx.roundRect(o.x, o.y, o.w, o.h * 0.15, 3);
      ctx.fill();
      // 阴影线
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(o.x, o.y, o.w, o.h);
    }

    function drawCactus(o) {
      const x = o.x, y = o.y, w = o.w, h = o.h;
      ctx.fillStyle = o.color;
      // 主干
      ctx.beginPath();
      ctx.roundRect(x + w * 0.3, y, w * 0.4, h, 3);
      ctx.fill();
      // 左臂
      ctx.beginPath();
      ctx.roundRect(x, y + h * 0.25, w * 0.35, h * 0.15, 3);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x, y + h * 0.1, w * 0.15, h * 0.3, 3);
      ctx.fill();
      // 右臂
      ctx.beginPath();
      ctx.roundRect(x + w * 0.65, y + h * 0.3, w * 0.35, h * 0.15, 3);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x + w * 0.85, y + h * 0.15, w * 0.15, h * 0.3, 3);
      ctx.fill();
      // 顶部高光点
      ctx.fillStyle = o.top;
      ctx.beginPath();
      ctx.arc(x + w * 0.5, y, w * 0.12, 0, Math.PI * 2);
      ctx.fill();
    }

    // ─────────────────────────────────────────────
    // 粒子系统（跳跃时的尘埃效果）
    // ─────────────────────────────────────────────
    const particles = [];

    function spawnJumpParticles(px, py) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: px + (Math.random() - 0.5) * 20,
          y: py,
          vx: (Math.random() - 0.5) * 3,
          vy: -(Math.random() * 2 + 1),
          life: 1,
          size: Math.random() * 4 + 2,
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= dt * 2;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life * 0.6;
        ctx.fillStyle = '#c8a96e';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // ─────────────────────────────────────────────
    // 碰撞检测（AABB 矩形碰撞）
    // ─────────────────────────────────────────────
    function checkCollision() {
      const pb = player.getBox();
      for (const o of obstacles) {
        if (
          pb.x < o.x + o.w &&
          pb.x + pb.w > o.x &&
          pb.y < o.y + o.h &&
          pb.y + pb.h > o.y
        ) {
          return true;
        }
      }
      return false;
    }

    // ─────────────────────────────────────────────
    // HUD：分数 / 最高分显示
    // ─────────────────────────────────────────────
    function drawHUD() {
      const fontSize = Math.round(H() * 0.07);
      ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
      ctx.textBaseline = 'top';

      // 当前分数（居中）
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.floor(game.score)}`, W() * 0.5 + 2, H() * 0.04 + 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(`${Math.floor(game.score)}`, W() * 0.5, H() * 0.04);

      // 最高分（右上角）
      const smallFont = Math.round(H() * 0.045);
      ctx.font = `${smallFont}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText(`最高 ${Math.floor(game.best)}`, W() * 0.97, H() * 0.04);

      // 当前速度倍率（左上角）
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText(`x${game.speed.toFixed(1)}`, W() * 0.03, H() * 0.04);
    }

    // ─────────────────────────────────────────────
    // 开始界面
    // ─────────────────────────────────────────────
    function drawReady() {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W(), H());

      const cx = W() / 2, cy = H() / 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 标题
      ctx.font = `bold ${Math.round(H() * 0.13)}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = '#fff176';
      ctx.fillText('跑酷！', cx, cy - H() * 0.18);

      // 副标题
      ctx.font = `${Math.round(H() * 0.06)}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = '#e0e0e0';
      ctx.fillText('支持二段跳 · 躲避障碍物', cx, cy - H() * 0.03);

      drawButton(cx, cy + H() * 0.15, '开始游戏');
    }

    // ─────────────────────────────────────────────
    // 死亡界面
    // ─────────────────────────────────────────────
    function drawDead() {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W(), H());

      const cx = W() / 2, cy = H() / 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 游戏结束标题
      ctx.font = `bold ${Math.round(H() * 0.11)}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = '#ef9a9a';
      ctx.fillText('游戏结束', cx, cy - H() * 0.22);

      // 最终得分
      ctx.font = `bold ${Math.round(H() * 0.09)}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = '#fff176';
      ctx.fillText(`得分  ${Math.floor(game.score)}`, cx, cy - H() * 0.06);

      // 最高分 / 新纪录提示
      const isNew = game.score >= game.best;
      ctx.font = `${Math.round(H() * 0.055)}px 'Segoe UI', sans-serif`;
      ctx.fillStyle = isNew ? '#69f0ae' : 'rgba(255,255,255,0.6)';
      ctx.fillText(isNew ? '🎉 新纪录！' : `最高分  ${Math.floor(game.best)}`, cx, cy + H() * 0.06);

      drawButton(cx, cy + H() * 0.22, '再来一局');
    }

    // 通用圆角按钮绘制
    function drawButton(cx, cy, text) {
      const bw = W() * 0.28, bh = H() * 0.14;
      const bx = cx - bw / 2, by = cy - bh / 2;

      // 按钮渐变背景
      const btnGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
      btnGrad.addColorStop(0, '#42a5f5');
      btnGrad.addColorStop(1, '#1565c0');
      ctx.fillStyle = btnGrad;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, bh / 2);
      ctx.fill();

      // 顶部高光
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.roundRect(bx + 2, by + 2, bw - 4, bh * 0.4, bh / 2);
      ctx.fill();

      // 文字
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${Math.round(H() * 0.065)}px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, cx, cy);
    }

    // ─────────────────────────────────────────────
    // 游戏核心对象
    // ─────────────────────────────────────────────
    const game = {
      state: STATE.READY,
      score: 0,
      best:  0,
      speed: 0.12,          // 初始移动速度（画布宽度比例/秒）
      obsTimer: 0,          // 障碍物生成计时器
      lastTime: 0,          // 上一帧时间戳

      start() {
        this.state    = STATE.RUNNING;
        this.score    = 0;
        this.speed    = 0.12;
        this.obsTimer = 0;
        obstacles.length  = 0;
        particles.length  = 0;
        player.reset();
      },

      over() {
        this.state = STATE.DEAD;
        this.best  = Math.max(this.best, this.score);
        spawnJumpParticles(player.x + player.w / 2, player.y + player.h);
      },
    };

    // ─────────────────────────────────────────────
    // 主循环（requestAnimationFrame 驱动）
    // ─────────────────────────────────────────────
    function loop(timestamp) {
      // 帧间隔（秒），限制最大值防止切回标签页时跳帧
      const dt = Math.min((timestamp - game.lastTime) / 1000, 0.05);
      game.lastTime = timestamp;

      if (game.state === STATE.RUNNING) {
        // 速度缓慢提升，上限 0.32
        game.speed = Math.min(0.32, game.speed + 0.000012);
        // 分数与速度正相关
        game.score += game.speed * 60 * dt * 1.5;

        player.update(dt);
        updateObstacles(dt);
        updateParticles(dt);

        if (checkCollision()) game.over();
      }

      // 绘制顺序：背景 → 地面 → 障碍物 → 粒子 → 玩家 → HUD → 界面遮罩
      drawBackground(dt);
      drawGround();
      drawObstacles();
      drawParticles();
      player.draw();
      drawHUD();

      if (game.state === STATE.READY) drawReady();
      if (game.state === STATE.DEAD)  drawDead();

      requestAnimationFrame(loop);
    }

    // ─────────────────────────────────────────────
    // 输入处理（键盘 + 鼠标/触摸）
    // ─────────────────────────────────────────────
    function handleAction() {
      if (game.state === STATE.READY || game.state === STATE.DEAD) {
        game.start();
      } else if (game.state === STATE.RUNNING) {
        player.jump();
      }
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); handleAction(); }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      handleAction();
    });

    // ─────────────────────────────────────────────
    // 窗口缩放后更新布局（不中断游戏）
    // ─────────────────────────────────────────────
    function resetLayout() {
      if (game.state !== STATE.RUNNING) return;
      player.reset();
      obstacles.forEach(o => { o.y = GROUND_Y() - o.h; });
    }

    // ─────────────────────────────────────────────
    // 启动
    // ─────────────────────────────────────────────
    player.reset();
    requestAnimationFrame(ts => {
      game.lastTime = ts;
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
